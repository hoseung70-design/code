<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INHA Industrial Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;700&family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1920×1080 stage; scales to any window, keeps 16:9 -->
  <div class="frame">
    <main class="stage">

      <!-- left: black field -->
      <section class="field">
        <h1 class="inha" aria-label="INHA">INHA</h1>

        <div class="tc">
          <span class="technical">TECHNICAL</span>
          <span class="college">COLLEGE</span>
        </div>

        <div class="bar"></div>

        <p class="meta meta--top">
          <span>01</span>
          <span>DEPARTMENT OF INDUSTRIAL DESIGN</span>
          <span class="ko">산업디자인과</span>
        </p>

        <img class="lockup" src="assets/inha-lockup.svg" alt="인하공업전문대학 INHA TECHNICAL COLLEGE">

        <ul class="keywords">
          <li>FORM</li>
          <li>FUNCTION</li>
          <li>INDUSTRY</li>
        </ul>
      </section>

      <!-- right: cyan panel -->
      <section class="panel">
        <div class="vertical">
          <span class="industrial">INDUSTRIAL</span>
          <span class="design">DESIGN</span>
        </div>
        <p class="meta meta--panel">ID / 16:9 / 1920×1080</p>
      </section>

      <!-- emblem on the seam -->
      <div class="seal">
        <img src="assets/inha-emblem.svg" alt="인하공업전문대학 엠블럼">
      </div>

      <div class="ruler" aria-hidden="true"></div>
    </main>
  </div>
</body>
</html>
