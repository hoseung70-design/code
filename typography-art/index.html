<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INHA Industrial Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1920×1080 stage; scales to any window, keeps 16:9. 10s loop. -->
  <div class="frame">
    <main class="stage" aria-label="INHA TECHNICAL COLLEGE INDUSTRIAL DESIGN">

      <!-- left: black field -->
      <h1 class="inha" aria-hidden="true">
        <span style="--i:0">I</span><span style="--i:1">N</span><span style="--i:2">H</span><span style="--i:3">A</span>
      </h1>

      <div class="bar"></div>

      <div class="tc" aria-hidden="true">
        <span class="technical">
          <span style="--i:0">T</span><span style="--i:1">E</span><span style="--i:2">C</span><span style="--i:3">H</span><span style="--i:4">N</span><span style="--i:5">I</span><span style="--i:6">C</span><span style="--i:7">A</span><span style="--i:8">L</span>
        </span>
        <span class="college">COLLEGE</span>
      </div>

      <!-- right: cyan panel -->
      <section class="panel" aria-hidden="true">
        <div class="vertical">
          <span class="industrial">INDUSTRIAL</span>
          <span class="design">DESIGN</span>
        </div>
      </section>

      <div class="ruler" aria-hidden="true"></div>

      <!-- emblem on the seam -->
      <div class="seal">
        <img src="assets/inha-emblem.svg" alt="인하공업전문대학 엠블럼">
      </div>
    </main>
  </div>
</body>
</html>
